name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  cla:
    uses: open-vela/public-actions/.github/workflows/cla.yml@dev
    secrets: inherit
